<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rescue Status</title>
    <style>
        :root {
            --bg: #020617;
            --surface: #0f172a;
            --primary: #ef4444;
            --success: #10b981;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 1rem;
            display: flex;
            justify-content: center;
        }
        .container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        h1 { margin-top: 0; font-size: 1.5rem; margin-bottom: 0.25rem; }
        .ticket-id { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; font-family: monospace; }
        
        .status-tracker {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin-bottom: 2rem;
            position: relative;
            padding-left: 0.5rem;
        }
        .status-tracker::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: var(--border);
            z-index: 0;
        }
        .status-step {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--text-muted);
            position: relative;
            z-index: 1;
        }
        .status-step.active {
            color: var(--primary);
            font-weight: 600;
        }
        .status-step.done {
            color: var(--success);
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--surface);
            border: 2px solid currentColor;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status-step.done .dot { background: currentColor; }
        
        .guidance-box {
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--primary);
        }
        .guidance-box h3 { margin: 0 0 0.5rem 0; font-size: 1rem; }
        .guidance-box p { margin: 0; font-size: 0.875rem; color: var(--text); line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rescue Status</h1>
        <div class="ticket-id" id="ticketId">Loading...</div>
        
        <div class="status-tracker" id="statusTracker">
            <div class="status-step" id="step-QUEUED"><div class="dot"></div> Queued</div>
            <div class="status-step" id="step-TEAM_ASSIGNED"><div class="dot"></div> Team Assigned</div>
            <div class="status-step" id="step-EN_ROUTE"><div class="dot"></div> En Route</div>
            <div class="status-step" id="step-RESCUED"><div class="dot"></div> Rescued</div>
            <div class="status-step" id="step-RESOLVED"><div class="dot"></div> Resolved</div>
        </div>
        
        <div class="guidance-box">
            <h3>Safety Guidance</h3>
            <p id="safetyGuidance">Stay calm and remain in your current location. Help is being coordinated.</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const ticket = urlParams.get('ticket');
        
        document.getElementById('ticketId').textContent = ticket ? `Ticket: ${ticket}` : 'Invalid Access Link';

        const stages = ['QUEUED', 'TEAM_ASSIGNED', 'EN_ROUTE', 'RESCUED', 'RESOLVED'];
        
        function updateStatusUI(currentStatus) {
            let passed = true;
            stages.forEach(stage => {
                const el = document.getElementById(`step-${stage}`);
                if (!el) return;
                
                el.className = 'status-step'; 
                if (stage === currentStatus) {
                    el.classList.add('active');
                    passed = false;
                } else if (passed) {
                    el.classList.add('done');
                }
            });
        }

        async function fetchStatus() {
            if (!token || !ticket) return;
            try {
                const res = await fetch(`/api/status?token=${token}&ticket=${ticket}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.ticket && data.ticket.status) updateStatusUI(data.ticket.status);
                    if (data.guidance) document.getElementById('safetyGuidance').textContent = data.guidance;
                }
            } catch (e) {
                console.log('Using offline/cached status');
            }
        }
        
        updateStatusUI('QUEUED');
        if(token && ticket) {
            fetchStatus();
            setInterval(fetchStatus, 15000); // refresh every 15s
        }
    </script>
</body>
</html>
